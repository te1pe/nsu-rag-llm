name: nsu-rag-llm

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no curl, no wget and no nc - only bash, hence /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      args:
        # The search models, on the CPU: the container answers /ask, not
        # just /health. Built without it, the image is a fifth of the size.
        EXTRAS: ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      # Ollama runs natively on the host - a container on macOS has no Metal.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      JUDGE_BASE_URL: http://host.docker.internal:11434/v1
      # Same reason: in here sentence-transformers can only use the CPU.
      DEVICE: cpu
      # ...and the cross-encoder would take tens of seconds per question on a
      # CPU, so answers here come from hybrid search alone (ADR-032).
      RERANKER_ENABLED: "false"
    volumes:
      # The index and the author's course titles, read-only; built natively.
      - ./data:/app/data:ro
      # Models are downloaded on the first question and kept between runs.
      - huggingface:/home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      # Deliberately not /health: that also reports on Qdrant and Ollama, and
      # this container is not unhealthy just because something else is down.
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.get('http://127.0.0.1:8000/openapi.json').raise_for_status()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  huggingface:
