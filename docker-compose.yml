name: nsu-rag-llm

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      args:
        EXTRAS: ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      JUDGE_BASE_URL: http://host.docker.internal:11434/v1
      DEVICE: cpu
      RERANKER_ENABLED: "false"
    volumes:
      - ./data:/app/data:ro
      - huggingface:/home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.get('http://127.0.0.1:8000/openapi.json').raise_for_status()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  huggingface:
