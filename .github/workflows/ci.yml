name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, so a
        # dependency change cannot be merged without its lock entry.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        # No network, no GPU, no Ollama, no course materials: everything
        # external is faked, so this is safe to run anywhere.
        run: uv run pytest

  docker:
    name: Build the API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --tag nsu-rag-llm:ci .
